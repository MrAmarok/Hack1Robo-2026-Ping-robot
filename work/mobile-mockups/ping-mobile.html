#ping-comparison * { box-sizing:border-box }
#ping-comparison .comparison-toolbar { display:flex;flex-wrap:wrap;gap:8px 16px;margin:0 0 14px;align-items:end }
#ping-comparison label { display:grid;gap:4px;font-size:12px;font-weight:650 }
#ping-comparison select { max-width:100%;font:inherit;font-size:14px;padding:8px;color:var(--foreground);background:var(--background);border:1px solid var(--border);border-radius:8px }
#ping-comparison :focus-visible { outline:2px solid var(--ring,#4da9f2);outline-offset:2px }
#ping-caption { margin:11px 0 0;font-size:13px;color:var(--muted-foreground,var(--foreground)); }
#ping-comparison .device { --ink:#e8fff8;--muted:#a0bcb5;--edge:#263932;--panel:#0b1415;--green:#74e5bc;--stop:#f85e69; position:relative;isolation:isolate;background:#070c0d;color:var(--ink);width:100%;max-width:696px;margin:auto;overflow:hidden;border:1px solid #263733;border-radius:23px;font-family:system-ui,sans-serif;font-size:12px }
#ping-comparison .device h2,#ping-comparison .device h3,#ping-comparison .device p { margin:0 }
#ping-comparison .device button { font:inherit;font-weight:680;color:var(--ink);border:1px solid var(--edge);background:#101d1f;border-radius:8px;padding:8px;min-height:36px }
#ping-comparison .device button:disabled { opacity:.42 }
#ping-comparison .device .stop { background:var(--stop);border-color:var(--stop);color:#240708;font-weight:800 }
#ping-comparison .device .active { background:var(--green);color:#08251a;border-color:var(--green) }
#ping-comparison .device .flat { background:#0a1214df }
#ping-comparison .feed { position:relative;overflow:hidden;background:#030607;display:grid;place-items:center;min-height:160px }
#ping-comparison .feed.live { background-image:linear-gradient(180deg,#0b141533 0%,transparent 30%,transparent 68%,#09101260 100%),var(--feed);background-size:cover;background-position:center 58%; }
#ping-comparison .feed-message { padding:12px;text-align:center;max-width:220px;color:#b8c8c5;line-height:1.5 }
#ping-comparison .feed-message strong { display:block;color:#f2f8f7;font-size:15px }
#ping-comparison .status { display:inline-flex;align-items:center;gap:7px;font-weight:700;white-space:nowrap }
#ping-comparison .status::before { content:"";width:7px;height:7px;border-radius:50%;background:var(--green);flex:none }
#ping-comparison .status.offline::before { background:var(--stop) }
#ping-comparison .status.loading::before { background:#ffbc68 }
#ping-comparison .row { display:flex;gap:6px;align-items:center }
#ping-comparison .spread { justify-content:space-between }
#ping-comparison .actions { display:grid;grid-template-columns:repeat(3,1fr);gap:6px }
#ping-comparison .portrait .actions { grid-template-columns:repeat(4,minmax(0,1fr)) }
#ping-comparison .keys { display:flex;gap:5px;align-items:center }
#ping-comparison .keys button { min-width:40px;min-height:42px;font-size:18px;line-height:1;padding:5px }
#ping-comparison .controls { display:grid;gap:9px;padding:10px;background:var(--panel) }
#ping-comparison .controls .hint { font-weight:660;color:var(--muted);font-size:11px;text-align:center }
#ping-comparison .speed { width:100%;display:grid;grid-template-columns:auto 1fr 4ch;align-items:center;gap:8px;color:var(--muted);font-size:11px }
#ping-comparison input[type=range] { width:100%;min-width:0;accent-color:var(--green) }
#ping-comparison .device-header { display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px }
#ping-comparison .device-header strong { font-size:16px }
#ping-comparison .portrait,.pair,.home { max-width:342px!important }
#ping-comparison .portrait .feed { height:228px }
#ping-comparison .portrait .stop { min-height:43px }
#ping-comparison .overlay .feed,#ping-comparison .current .feed { height:clamp(260px,49vw,346px) }
#ping-comparison .overlay .video-top,#ping-comparison .overlay .video-bottom,#ping-comparison .current .video-top,#ping-comparison .current .video-bottom { position:absolute;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px }
#ping-comparison .video-top { top:10px;align-items:flex-start }
#ping-comparison .video-bottom { bottom:10px;align-items:end }
#ping-comparison .overlay .status { background:#0a1214e8;padding:9px;border-radius:8px }
#ping-comparison .overlay .speed { position:absolute;left:50%;transform:translateX(-50%);bottom:68px;width:min(48%,230px);padding:7px 8px;background:#0a1214e8;border-radius:8px;color:var(--ink) }
#ping-comparison .rail { display:grid;grid-template-columns:minmax(0,1fr) minmax(124px,27%) }
#ping-comparison .rail .feed { height:100%;min-height:285px }
#ping-comparison .rail .controls { align-content:center;border-left:1px solid var(--edge);padding:9px }
#ping-comparison .rail .keys { justify-content:space-between }
#ping-comparison .rail .keys button { flex:1 }
#ping-comparison .rail .actions { grid-template-columns:1fr }
#ping-comparison .rail .actions button { min-height:29px;padding:5px }
#ping-comparison .rail .status { font-size:11px;white-space:normal }
#ping-comparison .current { --edge:#24604d;--panel:#0b1016;--green:#00e5a0;border-color:#2b3b37;max-width:696px }
#ping-comparison .current .video-top { flex-wrap:wrap;justify-content:flex-start;gap:4px }
#ping-comparison .current .video-top button { min-width:28px;min-height:30px;padding:4px 6px;background:#0b1016e8;font-size:12px }
#ping-comparison .current .video-top .old-stop { border:2px solid #ff3b5c }
#ping-comparison .current .current-pan { position:absolute;left:10px;top:84px;display:flex;gap:3px }
#ping-comparison .current .current-pan button { min-height:27px;padding:3px 7px }
#ping-comparison .current .speed { position:absolute;right:12px;top:87px;width:min(100px,30%);color:#fff;background:#0b1016e8;padding:4px;border-radius:5px }
#ping-comparison .old-screen { padding:16px;background:#05070a;--panel:#0b1016;--green:#00e5a0;--edge:#204e42 }
#ping-comparison .old-screen h2 { font-size:27px;letter-spacing:1px }
#ping-comparison .old-screen section { margin-top:10px;padding:10px;background:var(--panel);border:1px solid var(--edge);border-radius:12px }
#ping-comparison .old-screen section p { margin-top:6px;color:#a9c6bc }
#ping-comparison .old-screen .feed { min-height:145px;margin-top:8px;border-radius:8px }
#ping-comparison .old-screen .alarm { width:100%;margin-top:10px;border-color:#9b4957;color:#ffb2bd }
#ping-comparison .old-screen .mode button { flex:1 }
#ping-comparison .device .field { display:block;margin-top:8px;padding:8px 10px;border:1px solid var(--edge);border-radius:9px;color:#a4beb7;background:#0d151d }
#ping-comparison .full { width:100%;margin-top:10px }
#ping-comparison .drawer { position:fixed;inset:0;margin:auto;width:min(420px,calc(100% - 28px));max-height:min(420px,calc(100% - 28px));overflow:auto;overscroll-behavior:contain;color:var(--ink);padding:14px;background:#111c1d;border:1px solid #52796a;border-radius:15px;box-shadow:0 14px 50px #0008 }
#ping-comparison .drawer[open] { display:grid;gap:10px }
#ping-comparison .drawer::backdrop { background:#030809b8 }
#ping-comparison .drawer [hidden],#ping-comparison .drawer:not([open]) { display:none }
#ping-comparison .option-grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px }
#ping-comparison .option-grid button { text-align:left }
#ping-comparison .option-grid .warning { color:#ffc3c6;border-color:#a85058 }
#ping-comparison .option-grid .active.warning { color:#2d090c;background:#f98f95 }
#ping-comparison .option-wide { grid-column:1/-1 }
#ping-comparison .option-tabs { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px }
#ping-comparison .option-tabs button { padding:4px }
#ping-comparison .drawer .option-heading { font-size:15px }
#ping-comparison .drawer .option-note { color:var(--muted);line-height:1.35 }
#ping-comparison .drawer .preview-alert { margin:6px 0;min-height:115px;border-radius:8px }
#ping-comparison .map-preview { display:grid;place-items:center;min-height:130px;margin-top:8px;border:1px solid #426459;border-radius:9px;background:repeating-linear-gradient(25deg,transparent 0 24px,#71877b 25px 29px,transparent 30px 50px),repeating-linear-gradient(105deg,#344a3d 0 32px,#8a998a 33px 39px,#344a3d 40px 72px) }
#ping-comparison .map-pin { border:2px solid #caffec;border-radius:7px;padding:4px 8px;background:#174632;color:#fff;font-weight:700 }
#ping-comparison .overlay .map-trigger { position:absolute;top:53px;left:10px }
#ping-comparison .motors { padding-inline:6px!important }
#ping-comparison .demo-feedback { position:absolute;z-index:4;top:48%;left:50%;transform:translateX(-50%);padding:7px 11px;border-radius:7px;background:#132325;color:#fff;text-align:center;white-space:nowrap }
@media(max-width:420px) {
  #ping-comparison .device { border-radius:15px }
  #ping-comparison .overlay .feed,#ping-comparison .current .feed { height:260px }
  #ping-comparison .device button { font-size:11px }
  #ping-comparison .keys button { min-width:32px }
  #ping-comparison .rail .speed { grid-template-columns:1fr auto }
  #ping-comparison .rail .speed span:first-child { grid-column:1/-1 }
}
</style>
<script>
(() => {
  const root = document.getElementById('ping-comparison');
  const layout = root.querySelector('#ping-layout');
  const feed = root.querySelector('#ping-feed');
  const stage = root.querySelector('#ping-stage');
  const caption = root.querySelector('#ping-caption');
  const feedLabel = root.querySelector('#ping-feed-label');
  const statusText = { live:'Robot connecté', loading:'Connexion au flux', off:'Caméra coupée', offline:'Robot hors ligne' };
  const layoutText = {
    current:'Reconstitution du pilotage actuel d’après le code Expo. Flux simulé.',
    home:'Reconstitution de l’accueil après appairage. Flux simulé.',
    pair:'Reconstitution de l’écran avant appairage.',
    portrait:'Commandes sous l’image. L’arrêt d’urgence reste accessible au pouce.',
    overlay:'Le flux occupe tout l’écran. Les commandes se répartissent dans les coins.',
    rail:'Les commandes restent à droite. La zone vidéo reste dégagée.',
  };
  const button = (label, action, cls='', title=label, attributes='') =>
    '<button type="button" class="'+cls+' cursor-interaction" data-action="'+action+'" aria-label="'+title+'" '+attributes+'>'+label+'</button>';
  const emergency = () => button('Arrêt d’urgence','stop','stop');
  const status = () => '<span class="status '+feed.value+'">'+statusText[feed.value]+'</span>';
  const keys = (labels) => '<div class="keys">'+labels.map(([symbol,name]) =>
    button(symbol,'motion','flat',name,feed.value==='offline'?'disabled':'')).join('')+'</div>';
  const turn = () => keys([['◀','Tourner à gauche'],['▶','Tourner à droite']]);
  const drive = () => keys([['▲','Avancer'],['▼','Reculer']]);
  const speed = () => '<label class="speed"><span>Vitesse</span><input type="range" min="0" max="100" value="60"><output>60 %</output></label>';
  const tools = () => '<div class="actions">'+button('Écouter','toggle')+button('Parler','toggle')+button('Carte','map','map-trigger')+button('Options','options')+'</div>';
  const motorStop = () => button('■','motor-stop','flat motors','Stop moteurs');
  const toggle = (label, action='toggle', cls='') => button(label,action,cls,label,'aria-pressed="false"');
  const optionTabs = [['camera','Caméra'],['audio','Audio'],['events','Alertes']];
  const archive = (key, title, content) =>
    '<section data-archive="'+key+'" hidden><div class="row spread"><strong>'+title+'</strong>'+
    button('Retour','archive-back')+'</div>'+content+'</section>';
  const drawer = () => '<dialog class="drawer" aria-labelledby="ping-dialog-title">'+
    '<div class="row spread"><strong id="ping-dialog-title" class="option-heading">Options de pilotage</strong>'+button('Fermer','close')+'</div>'+
    '<div class="option-tabs" aria-label="Catégories">'+optionTabs.map(([key,name],i) =>
      button(name,'tab-'+key,i===0?'active':'',name,'aria-pressed="'+(i===0)+'"')).join('')+'</div>'+
    '<section class="option-grid" data-panel="camera">'+
      button('Caméra arrière','rear')+button(feed.value==='off'?'Allumer la caméra':'Couper la caméra','drawer-power')+
      button('Prendre une photo','demo')+toggle('Enregistrer la vidéo')+
      '<div class="row spread option-wide" aria-label="Zoom">'+button('−','zoom-out','flat','Réduire le zoom')+
      button('1,0×','zoom-reset','flat','Réinitialiser le zoom')+button('+','zoom-in','flat','Augmenter le zoom')+'</div>'+
      '<div class="row spread option-wide"><span>Orientation</span>'+
      '<div class="row">'+[['◀','Gauche'],['▲','Haut'],['⦿','Recentrer'],['▼','Bas'],['▶','Droite']].map(([icon,name]) =>
        button(icon,'pan','flat',name)).join('')+'</div></div></section>'+
    '<section class="option-grid" data-panel="audio" hidden>'+
      toggle('Écouter')+toggle('Parler au talkie')+
      button('Réveiller l’assistant vocal','demo')+toggle('Conversation IA en direct')+
      toggle('Sortie haut-parleur','speaker')+'</section>'+
    '<section class="option-grid" data-panel="events" hidden>'+
      button('Carte sonar','sonar')+button('Enregistrements','records')+
      button('Historique des alertes','alerts')+button('Dernière photo d’alerte','alert-photo')+
      button('Alarme · appui long','alarm','warning option-wide','Alarme. Maintenir pour activer, appuyer pour couper','aria-pressed="false"')+
      '</section>'+
    archive('records','Enregistrements','<div class="row spread"><span>14:32 · 18 Mo</span>'+button('Enregistrer dans la galerie','demo')+'</div>')+
    archive('alerts','Historique des alertes','<div class="row spread"><span>14:26 · Personne détectée</span>'+button('Voir la photo','alert-photo')+'</div>')+
    archive('alert-photo','Dernière photo d’alerte','<div class="feed live preview-alert" aria-label="Exemple de photo d’alerte"></div>')+
    archive('map','Carte du robot','<div class="row">'+button('GPS','map','active')+button('Sonar','sonar')+'</div>'+
      '<div class="map-preview" role="img" aria-label="Exemple de position GPS du robot"><span class="map-pin">● Robot</span></div>')+
    archive('sonar','Carte du robot','<div class="row">'+button('GPS','map')+button('Sonar','sonar','active')+'</div>'+
      '<p class="option-note">En attente d’un relevé sonar du robot.</p>')+
    '</dialog>';
  const video = (children='') => {
    const name = feed.value;
    const messages = {
      loading:'Attente de la première image…',
      off:'La caméra peut être réactivée depuis cet écran.',
      offline:'Vérifiez la connexion du robot.',
    };
    const message = name==='live'?'':'<div class="feed-message"><strong>'+statusText[name]+'</strong>'+messages[name]+
      (name==='off'?'<br>'+button('Allumer la caméra','enable','active'):'')+'</div>';
    return '<div class="feed '+name+'">'+message+children+'</div>';
  };
  const current = () => {
    const actions = [['✕','Fermer'],['Live sonar map','Carte sonar'],['🔈','Écouter'],['🎤','Assistant vocal'],['🎙️','Parler'],['💬','Conversation'],['⏺','Enregistrer'],['−','Réduire le zoom'],['+','Augmenter le zoom'],['🎞','Vidéos'],['📋','Alertes'],['📷','Photo'],['🚨','Alarme'],['⛔','Arrêt d’urgence'],['📞','Haut-parleur'],['⏻','Couper la caméra']];
    return video('<div class="video-top">'+actions.map(([icon,name])=>button(icon,name==='Arrêt d’urgence'?'stop':name==='Fermer'?'home':name==='Couper la caméra'?'power':'demo',name==='Arrêt d’urgence'?'old-stop':'',name)).join('')+
      '</div><div class="current-pan">'+['◀','▲','⦿','▼','▶'].map(x=>button(x,'demo')).join('')+'</div>'+speed()+
      '<div class="video-bottom">'+turn()+button('■','stop','flat','Stop moteurs')+drive()+'</div>');
  };
  const home = () => '<h2>Ping ⚡</h2><div class="row" style="margin-top:7px">'+status()+'</div><section><div class="row mode">'+
    button('🏠 NORMAL','mode','active')+button('🛡 ABSENT','mode')+
    '</div><p>Le robot surveille et vous prévient s’il voit quelqu’un.</p></section><section><div class="row spread"><h3>Camera</h3>'+
    button('⛶','current','flat','Ouvrir le plein écran')+'</div>'+video()+'</section>'+
    button('🚨 ALARME','demo','alarm')+'<section><h3>Carte du robot</h3><span class="field">Adresse de destination…</span><p>Position du robot en attente.</p></section>'+
    button('SE DÉCONNECTER','pair','full active');
  const pair = () => '<h2>Ping ⚡</h2><p style="margin-top:8px;color:#ffbe8c">Connecte-toi au robot</p><span class="field">Pseudo</span><span class="field">Code en commun</span><section><h3>Notifications (optionnel)</h3><p>Active-les pour recevoir un message même si l’app est en arrière-plan.</p>'+
    button('Activer les notifications','demo','full')+'</section>'+button('S’APPARIER','home','full active')+
    '<p style="margin-top:12px;color:#a0bcb5">🔴 En attente de l’autre…</p>';
  const portrait = () => '<header class="device-header">'+button('‹','home','flat','Retour à l’accueil')+'<strong>Pilotage</strong>'+status()+'</header>'+video()+
    '<div class="controls">'+tools()+speed()+'<div class="row spread">'+turn()+motorStop()+drive()+'</div>'+emergency()+'</div>'+drawer();
  const overlay = () => video('<div class="video-top">'+button('‹','home','flat','Retour à l’accueil')+status()+emergency()+'</div>'+button('Carte','map','flat map-trigger')+speed()+
    '<div class="video-bottom">'+turn()+'<div class="row">'+motorStop()+button('Options','options','flat')+'</div>'+drive()+'</div>')+drawer();
  const rail = () => video()+'<div class="controls">'+status()+emergency()+speed()+turn()+drive()+tools()+'</div>'+drawer();

  let zoom=1;
  let alarmTimer;
  function showDialog(dialog) {
    if(!dialog.open) dialog.showModal();
  }
  function choosePanel(name) {
    const drawer=stage.querySelector('.drawer');
    drawer.querySelector('.option-heading').textContent='Options de pilotage';
    drawer.querySelectorAll('[data-panel]').forEach(panel=>{ panel.hidden=panel.dataset.panel!==name; });
    drawer.querySelectorAll('[data-archive]').forEach(panel=>{ panel.hidden=true; });
    const tabs=drawer.querySelector('.option-tabs');
    tabs.hidden=false;
    tabs.querySelectorAll('button').forEach(tab=>{
      const selected=tab.dataset.action==='tab-'+name;
      tab.classList.toggle('active',selected);
      tab.setAttribute('aria-pressed',String(selected));
    });
  }
  function openArchive(name) {
    const drawer=stage.querySelector('.drawer');
    drawer.querySelector('.option-heading').textContent=['map','sonar'].includes(name)?'Carte du robot':'Options de pilotage';
    drawer.querySelector('.option-tabs').hidden=true;
    drawer.querySelectorAll('[data-panel], [data-archive]').forEach(panel=>{ panel.hidden=panel.dataset.archive!==name; });
    showDialog(drawer);
    drawer.querySelector('[data-archive="'+name+'"] button').focus();
  }
  function changeZoom(action) {
    zoom=action==='zoom-reset'?1:Math.max(1,Math.min(3,zoom+(action==='zoom-in'?.25:-.25)));
    stage.querySelector('[data-action=zoom-reset]').textContent=String(zoom.toFixed(2)).replace(/0$/,'').replace('.',',')+'×';
    const view=stage.querySelector('.feed');
    view.style.backgroundSize=zoom===1?'':(100*zoom)+'% auto';
  }
  function alarmState(button,active) {
    button.setAttribute('aria-pressed',String(active));
    button.classList.toggle('active',active);
    button.textContent=active?'Couper l’alarme':'Alarme · appui long';
    feedback(active?'Alarme activée · simulation':'Alarme coupée · simulation');
  }
  const views = {current, home, pair, portrait, overlay, rail};
  function render() {
    const key=layout.value;
    stage.innerHTML='<div class="device '+key+(['home','pair'].includes(key)?' old-screen':'')+'">'+views[key]()+'</div>';
    caption.textContent=layoutText[key];
    feedLabel.style.display=key==='pair'?'none':'';
    zoom=1;
    clearTimeout(alarmTimer);
  }
  function feedback(message) {
    const device=stage.firstElementChild;
    device.querySelector('.demo-feedback')?.remove();
    const indicator=document.createElement('span');
    indicator.className='demo-feedback';
    indicator.setAttribute('role','status');
    indicator.textContent=message;
    device.appendChild(indicator);
    setTimeout(()=>indicator.remove(),1400);
  }
  layout.addEventListener('change',render);
  feed.addEventListener('change',render);
  stage.addEventListener('input',(event)=>{
    if(event.target.matches('input[type=range]')) event.target.nextElementSibling.value=event.target.value+' %';
  });
  stage.addEventListener('pointerdown',event=>{
    const target=event.target.closest('[data-action=alarm]');
    if(!target||target.getAttribute('aria-pressed')==='true') return;
    clearTimeout(alarmTimer);
    alarmTimer=setTimeout(()=>{
      target.dataset.longPress='true';
      alarmState(target,true);
    },700);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(type=>stage.addEventListener(type,()=>clearTimeout(alarmTimer)));
  stage.addEventListener('click',(event)=>{
    if(event.target.matches('dialog[open]')) {
      const bounds=event.target.getBoundingClientRect();
      if(event.clientX<bounds.left||event.clientX>bounds.right||event.clientY<bounds.top||event.clientY>bounds.bottom) event.target.close();
      return;
    }
    const target=event.target.closest('button[data-action]');
    if(!target) return;
    const action=target.dataset.action;
    if(['current','home','pair'].includes(action)) { layout.value=action;render(); }
    else if(action==='enable'||action==='power') { feed.value=action==='enable'?'live':'off';render(); }
    else if(action==='options') {
      const dialog=stage.querySelector('.drawer');
      choosePanel('camera');
      showDialog(dialog);
      dialog.querySelector('[data-action=close]').focus();
    }
    else if(action==='close') stage.querySelector('.drawer').close();
    else if(action.startsWith('tab-')) choosePanel(action.slice(4));
    else if(['records','alerts','alert-photo','map','sonar'].includes(action)) openArchive(action);
    else if(action==='archive-back') {
      const panel=target.closest('[data-archive]');
      if(['map','sonar'].includes(panel.dataset.archive)) {
        stage.querySelector('.drawer').close();
      } else { choosePanel('events');stage.querySelector('[data-action=tab-events]').focus(); }
    }
    else if(action==='drawer-power') {
      feed.value=feed.value==='off'?'live':'off';
      stage.querySelector('.drawer').close();
      render();
      stage.querySelector('[data-action=options]').focus();
      showDialog(stage.querySelector('.drawer'));
      stage.querySelector('[data-action=drawer-power]').focus();
    }
    else if(action==='motor-stop') feedback('Stop moteurs · simulation');
    else if(action==='alarm') {
      if(target.dataset.longPress) delete target.dataset.longPress;
      else if(target.getAttribute('aria-pressed')==='true') alarmState(target,false);
      else if(event.detail===0) alarmState(target,true);
      else feedback('Maintenez pour activer l’alarme');
    }
    else if(action==='speaker') {
      const active=target.classList.toggle('active');
      target.setAttribute('aria-pressed',String(active));
      target.textContent=active?'Sortie écouteur':'Sortie haut-parleur';
      target.setAttribute('aria-label',target.textContent);
    }
    else if(action==='pan') feedback(target.getAttribute('aria-label')+' · simulation');
    else if(action==='stop') feedback('Arrêt simulé');
    else if(action==='motion') feedback(target.getAttribute('aria-label')+' · simulation');
    else if(action==='toggle') {
      const active=target.classList.toggle('active');
      target.setAttribute('aria-pressed',String(active));
    }
    else if(action==='mode') {
      target.parentElement.querySelector('.active')?.classList.remove('active');
      target.classList.add('active');
    }
    else if(action==='rear') {
      const isRear=target.textContent==='Caméra arrière';
      target.textContent=isRear?'Caméra avant':'Caméra arrière';
      target.setAttribute('aria-label',target.textContent);
      feedback(isRear?'Caméra arrière · simulation':'Caméra avant · simulation');
    }
    else if(action.startsWith('zoom-')) changeZoom(action);
    else feedback(target.getAttribute('aria-label')+' · simulation');
  });
  render();
})();
</script>
