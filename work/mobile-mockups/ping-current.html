  function render() {
    const pilot=page.value==='pilot';
    const key=[orientation.value,page.value,pilot?feed.value:'live'].join('/');
    const template=document.querySelector('template[data-view="'+key+'"]');
    phone.className='phone '+orientation.value;
    phone.innerHTML=template.innerHTML.replaceAll('__DEMO_FEED__',image);
    feedLabel.style.display=pilot?'':'none';
  }
  function navigate(event) {
    if(event.type==='keydown'&&!['Enter',' ','Escape'].includes(event.key)) return;
    if(event.type==='keydown'&&event.key==='Escape') {
      page.value='pilot';
      render();
      return;
    }
    const target=event.target.closest('[role=button]');
    if(!target) return;
    const label=target.getAttribute('aria-label')||target.textContent.trim();
    const next={'Options':'camera','Carte':'gps','Caméra':'camera','Audio':'audio','Alertes':'alerts','GPS':'gps','Sonar':'sonar','Carte sonar':'sonar','Fermer':'pilot','Fermer la modale':'pilot'}[label];
    if(next) {
      event.preventDefault();
      page.value=next;
      render();
    }
  }
  for(const input of [orientation,page,feed]) input.addEventListener('change',render);
  phone.addEventListener('click',navigate);
  phone.addEventListener('keydown',navigate);
  render();
})();
</script>
