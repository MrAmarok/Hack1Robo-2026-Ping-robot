[project]
name = "ping-server"
version = "2.0.0"
description = "Serveur Ping (FastAPI + Socket.IO) : relie l'app et le robot."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-socketio>=5.11",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # Assistant vocal (voice_brain) : sans cle, commandes locales seulement.
    # output_config / speed / betas sur messages.create : SDK recent requis.
    "anthropic>=2.12",
    # Conversation en direct OpenAI Realtime + flux audio Twilio.
    "websockets>=13",
]

[project.scripts]
ping-server = "app.main:main"

[dependency-groups]
dev = [
    # Le client de test Socket.IO (amene aiohttp).
    "python-socketio[asyncio_client]>=5.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
